name: GoIndiaCab Testing & QA Pipeline

on:
  push:
    branches: [ testing ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa-verify-and-build:
    name: 🧪 QA Test & Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run KMP Common Metadata Compilation
        run: ./gradlew :app:shared:compileCommonMainKotlinMetadata --no-daemon --stacktrace

      - name: Run JVM Unit Tests
        run: ./gradlew :app:shared:jvmTest --no-daemon --stacktrace

      - name: Assemble Debug QA APK
        run: ./gradlew :app:androidApp:assembleDebug --no-daemon --stacktrace

      - name: Archive QA Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: goindiacab-testing-apk
          path: app/androidApp/build/outputs/apk/debug/*.apk
          retention-days: 14
