name: GoIndiaCab CI Pipeline

on:
  push:
    branches: [ main, deploy, develop, testing, 'feature/**' ]
  pull_request:
    branches: [ main, deploy, develop, testing ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ------------------------------------------------------------------
  # Job 1: Wrapper Validation & Linting
  # ------------------------------------------------------------------
  lint-and-validate:
    name: 🔍 Validate & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run Android Lint (Debug)
        run: ./gradlew :app:androidApp:lintDebug --no-daemon --stacktrace

      - name: Archive Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: app/androidApp/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  # ------------------------------------------------------------------
  # Job 2: Automated Unit Tests
  # ------------------------------------------------------------------
  unit-tests:
    name: 🧪 Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run Unit Tests
        run: |
          ./gradlew :app:androidApp:testDebugUnitTest :server:test --no-daemon --stacktrace

      - name: Archive Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            app/androidApp/build/reports/tests/
            server/build/reports/tests/
          if-no-files-found: ignore

  # ------------------------------------------------------------------
  # Job 3: Build Android Artifacts (APK & Bundle) + Auto PR Comment
  # ------------------------------------------------------------------
  build-android:
    name: 📱 Build Android APK & AAB (Testing)
    needs: [lint-and-validate, unit-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build Debug Testing APK
        run: ./gradlew :app:androidApp:assembleDebug --no-daemon

      - name: Build Release Bundle (AAB)
        run: ./gradlew :app:androidApp:bundleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: goindiacab-testing-debug-apk
          path: app/androidApp/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: goindiacab-testing-release-bundle
          path: app/androidApp/build/outputs/bundle/release/*.aab
          retention-days: 14

      # --------------------------------------------------------------
      # Automated PR Comment with Testing Build & Download Links
      # --------------------------------------------------------------
      - name: 💬 Auto Comment on Pull Request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `### 🚀 GoIndiaCab CI — Testing Build Ready!

| Check / Artifact | Status | Details |
|---|---|---|
| 🔍 **Android Lint** | ✅ Passed | Code quality verified |
| 🧪 **Unit Tests** | ✅ Passed | All test suites green |
| 📱 **Debug Test APK** | 📦 Generated | Ready for device testing |
| 📦 **Release Bundle (AAB)** | 📦 Generated | Play Store test bundle |

📲 **QA Testers:** You can download the latest **Testing APK** directly from this run:
🔗 [Open Build Run & Download Artifacts](${runUrl})

*Automated by GoIndiaCab CI Bot · Commit: \`${context.sha.substring(0, 7)}\`*`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  # ------------------------------------------------------------------
  # Job 4: Build Desktop & Server Targets
  # ------------------------------------------------------------------
  build-desktop-and-server:
    name: 🖥️ Build Desktop & Backend
    needs: [lint-and-validate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build Desktop Application JAR
        run: ./gradlew :app:desktopApp:jar --no-daemon

      - name: Build Ktor Backend Server
        run: ./gradlew :server:build -x test --no-daemon
